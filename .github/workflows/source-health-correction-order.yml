name: Source health correction ordering
on:
  pull_request:
    paths:
      - 'src/schema/20260806_source_health_receipts.sql'
      - 'src/schema/20261022_source_health_receipt_correction_order.sql'
      - 'src/schema/rollback/20261022_source_health_receipt_correction_order.sql'
      - 'scripts/verify-source-health-correction-order.py'
      - '.github/workflows/source-health-correction-order.yml'
  push:
    branches: [main]
    paths:
      - 'src/schema/20260806_source_health_receipts.sql'
      - 'src/schema/20261022_source_health_receipt_correction_order.sql'
      - 'src/schema/rollback/20261022_source_health_receipt_correction_order.sql'
      - 'scripts/verify-source-health-correction-order.py'
      - '.github/workflows/source-health-correction-order.yml'
permissions:
  contents: read
jobs:
  source-health-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Reproduce tied-receipt defect and verify the actual migration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
        run: python scripts/verify-source-health-correction-order.py
