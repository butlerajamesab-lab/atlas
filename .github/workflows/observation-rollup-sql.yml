name: Observation rollup SQL equivalence
on:
  pull_request:
    paths:
      - 'src/schema/20261022_observation_read_model_covering_rollup.sql'
      - 'src/schema/rollback/20261022_observation_read_model_covering_rollup.sql'
      - 'scripts/verify-observation-rollup-equivalence.py'
      - '.github/workflows/observation-rollup-sql.yml'
  push:
    branches: [main]
    paths:
      - 'src/schema/20261022_observation_read_model_covering_rollup.sql'
      - 'src/schema/rollback/20261022_observation_read_model_covering_rollup.sql'
      - 'scripts/verify-observation-rollup-equivalence.py'
      - '.github/workflows/observation-rollup-sql.yml'
permissions:
  contents: read
jobs:
  query-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Compare old and new query expressions over edge-case inputs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
        run: python scripts/verify-observation-rollup-equivalence.py
